spring.application.name=backend-ep3
server.port=${PORT:8082}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/la_taverna?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:taverna}
spring.datasource.password=${MYSQL_PASSWORD:taverna_dev_only}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
jwt.secret=${JWT_SECRET:bG9jYWwtZGV2ZWxvcG1lbnQta2V5LW5vdC1mb3ItcHJvZHVjdGlvbi0zMg==}
jwt.expiration=PT15M
admin.registration-key=${ADMIN_REGISTRATION_KEY:}
app.product-images.directory=${PRODUCT_IMAGE_UPLOAD_DIR:${user.home}/.la-taverna/product-images}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
